<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>GOL</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/scaler.js" defer></script>
  <link rel="modulepreload" href="js/quiz.js">
  <link rel="modulepreload" href="js/quizFactory.js">
  <link rel="modulepreload" href="js/swipeInput.js">
  <link rel="modulepreload" href="js/gameController.js">
  <link rel="preload" as="fetch" href="data/lv.json" crossorigin>
  <script src="js/spine-canvas.js" defer></script>
</head>
<body>

  <!-- Loading overlay — hidden once Spine assets are ready -->
  <div id="loading">LOADING</div>

  <div id="game-screen" class="screen">

    <!-- HUD -->
    <div id="hud">
      <div id="hud-stats">
        <div id="score-display" class="hud-card">
          <span class="card-icon">🏆</span>
          <div class="card-text">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="score">0</span>
          </div>
        </div>
        <div id="combo-display">
          <span class="stat-label">COMBO</span>
          <span class="stat-value" id="combo">0</span>
        </div>
        <div id="level-display" class="hud-card">
          <div class="card-text">
            <span class="stat-label">LEVEL</span>
            <span class="stat-value" id="level-val">1</span>
          </div>
          <span class="card-icon">★</span>
        </div>
      </div>
      <div id="time-bar-track"><div id="time-fill"></div></div>
    </div>

    <!-- Panels -->
    <div id="quiz-area"></div>

    <!-- High / Low direction banner -->
    <div id="op-banner">
      <span class="speed-lines left"><i></i><i></i><i></i></span>
      <span id="op-indicator">
        <span id="hl-high">HIGH</span>
        <span id="op-arrow">▼</span>
        <span id="hl-low">LOW</span>
      </span>
      <span class="speed-lines right"><i></i><i></i><i></i></span>
      <span id="op-label" class="sr-only">—</span>
    </div>

    <!-- Invisible swipe/tap capture layer -->
    <div id="swipe-area" tabindex="0"></div>

    <!-- Game over overlay -->
    <div id="gameover" class="hidden">
      <span id="gameover-text">GAME OVER</span>
    </div>

    <!-- Countdown overlay -->
    <div id="countdown" class="hidden">
      <span id="countdown-text"></span>
    </div>

    <!-- Items bar (gameplay only) -->
    <div id="items-bar">
      <span class="items-header">ITEMS</span>
      <div class="items-row">
        <button class="item" id="item-freeze" data-item="freeze" type="button">
          <span class="item-icon">❄</span>
          <span class="item-name">FREEZE</span>
          <span class="item-badge" id="item-freeze-badge">×1</span>
        </button>
        <div class="item" id="item-double" data-item="double">
          <span class="item-icon">×2</span>
          <span class="item-name">DOUBLE</span>
        </div>
        <div class="item item-empty" aria-hidden="true"></div>
        <div class="item" id="item-shield" data-item="shield">
          <span class="item-icon">+1</span>
          <span class="item-name">SHIELD</span>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { GameController }  from './js/gameController.js';
    import { SwipeInput }      from './js/swipeInput.js';
    import { load as spineLoad, createBlock, createBoard, destroyAll, playAnim, playActive, playIncorrect, playBoardAnim } from './js/spineRenderer.js';
    import { loadSfx, play as playSfx, unlockAudio } from './js/sfx.js';
    import { startSession } from './js/leaderboard.js';

    const SKIN_MAP = { 1:'Number', 2:'Negative', 3:'Word', 4:'Dice', 5:'FiveBar', 6:'Roman', 7:'Clock', 8:'NumberTH', 9:'WordTH' };

    // Mulberry32 seeded PRNG — same seed → identical quiz sequence
    function makeRng(seed) {
      let s = seed >>> 0;
      return () => {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 0x100000000;
      };
    }

    // ── Countdown ──

    function runCountdown(startCb) {
      return new Promise(resolve => {
        const overlay = document.getElementById('countdown');
        const textEl  = document.getElementById('countdown-text');
        overlay.classList.remove('hidden');
        unlockAudio(); // best-effort — needs a prior user gesture to actually play

        const steps = [['3', 'num', 1000], ['2', 'num', 1000], ['1', 'num', 1000]];
        let i = 0;

        function nextStep() {
          if (i < steps.length) {
            const [label, cls, dur] = steps[i++];
            textEl.textContent = label;
            textEl.className = '';
            void textEl.offsetWidth;
            textEl.className = cls;
            playSfx('countTick');
            setTimeout(nextStep, dur);
          } else {
            // Show START and begin the game simultaneously
            textEl.textContent = 'START';
            textEl.className = '';
            void textEl.offsetWidth;
            textEl.className = 'start';
            playSfx('countGo');
            startCb();
            setTimeout(() => {
              overlay.classList.add('hidden');
              resolve();
            }, 750);
          }
        }

        nextStep();
      });
    }

    // ── DOM refs ──
    const quizArea    = document.getElementById('quiz-area');
    const timeFillEl  = document.getElementById('time-fill');
    const scoreEl     = document.getElementById('score');
    const comboEl     = document.getElementById('combo');
    const swipeArea   = document.getElementById('swipe-area');
    const loadingEl   = document.getElementById('loading');
    const opArrowEl  = document.getElementById('op-arrow');
    const opLabelEl  = document.getElementById('op-label');
    const hlHighEl   = document.getElementById('hl-high');
    const hlLowEl    = document.getElementById('hl-low');
    const levelValEl = document.getElementById('level-val');
    const itemEls    = {
      freeze: document.getElementById('item-freeze'),
      double: document.getElementById('item-double'),
      shield: document.getElementById('item-shield'),
    };
    const freezeBadgeEl = document.getElementById('item-freeze-badge');

    // ── State ──
    let panels = []; // parallel to controller._quizList

    // ── Block / row / panel creation ──

    function createBlockEl(block) {
      const el = document.createElement('div');
      el.className = `block t-${block.getBlockType()}`;
      el.appendChild(createBlock(block.getNumber(), SKIN_MAP[block.getBlockType()] || 'Number'));
      return el;
    }

    function createRowEl(line) {
      const row = document.createElement('div');
      // Start dimmed/inactive; refreshBoardStates() clears it on the active row.
      row.className = 'quiz-row inactive';
      row.dataset.answer = line.Answer;

      // Live QuizBoard behind the blocks; starts on its `inactive` clip.
      const board = createBoard();
      row._board = board;
      row.appendChild(board);

      const left = document.createElement('div');
      left.className = 'side left';
      for (let i = 0; i < line.LeftBlock.length; i++) {
        if (i > 0) {
          const plus = document.createElement('span');
          plus.className = 'block-op';
          plus.textContent = '+';
          left.appendChild(plus);
        }
        left.appendChild(createBlockEl(line.LeftBlock[i]));
      }

      // Transparent centre element — the "=" is baked into the board art; this
      // stays only as the equal-answer tap target (swipeInput checks `.divider`).
      const div = document.createElement('div');
      div.className = 'divider';

      const right = document.createElement('div');
      right.className = 'side right';
      for (let i = 0; i < line.RightBlock.length; i++) {
        if (i > 0) {
          const plus = document.createElement('span');
          plus.className = 'block-op';
          plus.textContent = '+';
          right.appendChild(plus);
        }
        right.appendChild(createBlockEl(line.RightBlock[i]));
      }

      row.append(left, div, right);
      return row;
    }

    function createPanelEl(quiz) {
      const panel = document.createElement('div');
      panel.className = 'quiz-panel';
      for (const line of quiz.getLines()) {
        panel.appendChild(createRowEl(line));
      }
      return panel;
    }

    function updateOpIndicator() {
      if (panels.length === 0) return;
      const firstRow = panels[0].querySelector('.quiz-row');
      if (!firstRow) return;
      const answer = parseInt(firstRow.dataset.answer, 10);
      if (answer === 0)      { opArrowEl.textContent = '◀'; opLabelEl.textContent = 'LEFT';  }
      else if (answer === 1) { opArrowEl.textContent = '▶'; opLabelEl.textContent = 'RIGHT'; }
      else                   { opArrowEl.textContent = '▲'; opLabelEl.textContent = 'EQUAL'; }
      // Light the HIGH/LOW banner side that matches the required swipe.
      hlHighEl.classList.toggle('lit', answer === 0 || answer === 2);
      hlLowEl.classList.toggle('lit',  answer === 1 || answer === 2);
    }

    // ── Animation helpers ──

    function animateBlocksCorrect(sideEl) {
      sideEl.querySelectorAll('.block').forEach(b => {
        b.classList.add('anim-correct');
        const c = b.querySelector('canvas');
        if (c) playAnim(c, 'correct', false);
      });
    }

    function animateBlocksFade(sideEl) {
      sideEl.querySelectorAll('.block').forEach(b => {
        b.style.transition = 'opacity 0.15s ease';
        b.style.opacity = '0';
      });
    }

    function animateBlocksIncorrect(sideEl) {
      sideEl.querySelectorAll('.block').forEach(b => {
        b.classList.remove('anim-incorrect');
        void b.offsetWidth;
        b.classList.add('anim-incorrect');
        const c = b.querySelector('canvas');
        if (c) playIncorrect(c);
      });
    }

    // ── View update functions ──

    function addQuiz(quiz) {
      const panelEl = createPanelEl(quiz);
      quizArea.appendChild(panelEl);
      panels.push(panelEl);
      if (panels.length === 1) activateTop();
    }

    function activateTop() {
      if (panels.length === 0) return;
      panels[0].classList.add('active');
      panels[0].querySelectorAll('.block canvas').forEach(c => playActive(c));
      updateOpIndicator();
      refreshBoardStates();
    }

    // Board state: the current row (first row of the active panel) plays `active`;
    // every other row's board stays `inactive`.
    function refreshBoardStates() {
      const cur = panels[0]?.querySelector('.quiz-row');
      document.querySelectorAll('.quiz-row').forEach(r => {
        if (r._board) playBoardAnim(r._board, 'inactive');
        r.classList.toggle('inactive', r !== cur); // dims the blocks to match the board
      });
      if (cur?._board) playBoardAnim(cur._board, 'active');
    }

    function onCorrect(side, done) {
      if (panels.length === 0) return;
      playSfx(done ? 'quizDone' : 'correct');

      const panel = panels[0];
      const row   = panel.querySelector('.quiz-row');
      if (!row) return;

      const leftEl  = row.querySelector('.side.left');
      const rightEl = row.querySelector('.side.right');

      if (side === 0) { animateBlocksCorrect(leftEl);  animateBlocksFade(rightEl); }
      if (side === 1) { animateBlocksFade(leftEl);  animateBlocksCorrect(rightEl); }
      if (side === 2) { animateBlocksCorrect(leftEl);  animateBlocksCorrect(rightEl); }

      // Board: halves slide apart (left/right) or equal-flash + slide (middle)
      if (row._board) playBoardAnim(row._board, side === 2 ? 'equal_correct' : 'correct');

      // Remove the answered row after block animations settle (~0.3s)
      setTimeout(() => {
        destroyAll(row);
        row.remove();

        if (!done) { updateOpIndicator(); refreshBoardStates(); }
        if (done) {
          panels.shift();
          const h = panel.offsetHeight;
          panel.style.maxHeight    = h + 'px';
          panel.style.overflow     = 'hidden';
          panel.style.transition   = 'opacity 0.28s ease, max-height 0.46s cubic-bezier(0.4,0,0.2,1), margin-bottom 0.46s cubic-bezier(0.4,0,0.2,1)';
          panel.classList.add('exiting');
          requestAnimationFrame(() => requestAnimationFrame(() => {
            panel.style.maxHeight    = '0';
            panel.style.marginBottom = '0';
            panel.style.opacity      = '0';
          }));
          setTimeout(() => {
            destroyAll(panel);
            panel.remove();
            activateTop();
          }, 480);
        }
      }, 300);
    }

    function onIncorrect(side) {
      if (panels.length === 0) return;
      playSfx('incorrect');

      const row = panels[0].querySelector('.quiz-row');
      if (!row) return;

      if (side === 0 || side === 2) animateBlocksIncorrect(row.querySelector('.side.left'));
      if (side === 1 || side === 2) animateBlocksIncorrect(row.querySelector('.side.right'));

      // Board flashes the side that WAS the correct answer, then returns to active.
      if (row._board) {
        const ans  = parseInt(row.dataset.answer, 10);
        const clip = ans === 0 ? 'left_incorrect' : ans === 1 ? 'right_incorrect' : 'equal_incorrect';
        playBoardAnim(row._board, clip, { then: 'active' });
      }
    }

    function updateItemUI(id, state) {
      const el = itemEls[id];
      if (!el) return;

      if (id === 'freeze') {
        if (state.active) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
          // Charge spent → mark used and disable further taps.
          if (state.charges <= 0) {
            el.classList.add('used');
            el.disabled = true;
          }
        }
        if (freezeBadgeEl) freezeBadgeEl.textContent = `×${state.charges}`;
        return;
      }

      // Double / Shield are passive — active by default, greyed when consumed.
      if (state.active) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
        el.classList.add('used');
        if (id === 'shield') playSfx('itemShield');
      }
    }

    function resetItemsUI() {
      itemEls.freeze.classList.remove('used');
      itemEls.freeze.classList.remove('active');
      itemEls.freeze.disabled = false;
      if (freezeBadgeEl) freezeBadgeEl.textContent = '×1';
      itemEls.double.classList.remove('used');
      itemEls.double.classList.add('active');
      itemEls.shield.classList.remove('used');
      itemEls.shield.classList.add('active');
    }

    function onGameEnd(result) {
      sessionStorage.setItem('gameResult', JSON.stringify(result));
      // Wait for the incorrect shake animation to finish (~400ms), then show overlay
      setTimeout(() => {
        document.getElementById('gameover').classList.remove('hidden');
        setTimeout(() => { window.location.href = 'result.html'; }, 1800);
      }, 400);
    }

    // ── Bootstrap ──

    async function init() {
      const [lvData] = await Promise.all([
        fetch('data/lv.json').then(r => r.json()),
        spineLoad('spine'),
        loadSfx(),
      ]);
      loadingEl.style.display = 'none';

      // Consume seed from challenge link (one-time); replay gets a fresh random seed
      const rawSeed = sessionStorage.getItem('pendingSeed');
      sessionStorage.removeItem('pendingSeed');
      const seed = rawSeed != null ? (parseInt(rawSeed, 10) >>> 0)
                                   : (Math.random() * 0x100000000 >>> 0);

      const controller = new GameController(lvData, makeRng(seed));

      // Wire callbacks
      controller.onScoreUpdate = v => { scoreEl.textContent = v; };
      controller.onComboUpdate = v => { comboEl.textContent = v; };
      controller.onTimeFill    = f => {
        timeFillEl.style.transform = `scaleX(${Math.max(0, f)})`;
      };
      controller.onQuizAdded  = quiz => addQuiz(quiz);
      controller.onCorrect    = (side, done) => onCorrect(side, done);
      controller.onIncorrect  = side => onIncorrect(side);
      controller.onGameEnd    = result => onGameEnd({ ...result, seed });
      controller.onLevelUpdate = v => { levelValEl.textContent = v; };
      controller.onItemUpdate  = (id, state) => updateItemUI(id, state);

      // Wire input
      const swipe = new SwipeInput(swipeArea);
      swipeArea.addEventListener('lefttap',  () => { unlockAudio(); playSfx('tap'); controller.answerLeft(); });
      swipeArea.addEventListener('righttap', () => { unlockAudio(); playSfx('tap'); controller.answerRight(); });
      swipeArea.addEventListener('midtap',   () => { unlockAudio(); playSfx('tap'); controller.answerMid(); });
      swipeArea.addEventListener('swipe',    () => { unlockAudio(); playSfx('tap'); controller.answerSwipe(); });

      // Freeze item — stop the tap from reaching the swipe capture layer.
      itemEls.freeze.addEventListener('pointerdown', e => {
        e.stopPropagation();
        e.preventDefault();
        unlockAudio();
        playSfx('itemFreeze');
        controller.useFreeze();
      });

      document.addEventListener('keydown', e => {
        if (e.repeat) return;
        if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') { unlockAudio(); playSfx('tap'); controller.answerLeft();  }
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { unlockAudio(); playSfx('tap'); controller.answerRight(); }
        if (e.key === 'ArrowUp'    || e.key === 'ArrowDown' ||
            e.key === 'w'          || e.key === 'W' ||
            e.key === 's'          || e.key === 'S')                  { unlockAudio(); playSfx('tap'); controller.answerMid();   }
      });

      resetItemsUI();

      // Selected mode (set by the menu). Rank mode runs with no items.
      const mode = sessionStorage.getItem('mode') || 'normal';
      const isRank = mode === 'rank';
      if (isRank) {
        document.getElementById('items-bar').style.display = 'none';
      }

      // Handle duel launch from sessionStorage
      const duelRaw = sessionStorage.getItem('pendingDuelChallenge');
      if (duelRaw) {
        sessionStorage.removeItem('pendingDuelChallenge');
        const duelData = JSON.parse(duelRaw);
        await runCountdown(() => controller.startDuelGame(duelData));
      } else if (isRank) {
        // Open a server-timestamped session so the leaderboard rule can cap the
        // score by real elapsed time. This runs in the BACKGROUND — a slow or
        // hanging Firebase fetch must never block (or stall) the start of play.
        // The sid is only needed at submit time, long after the run begins.
        sessionStorage.removeItem('rankSid');
        startSession()
          .then(sid => sessionStorage.setItem('rankSid', sid))
          .catch(() => {});
        await runCountdown(() => controller.startRankGame());
      } else {
        await runCountdown(() => controller.startGame());
      }

      swipeArea.focus();
    }

    init().catch(err => {
      console.error(err);
      loadingEl.textContent = 'LOAD FAILED — check console';
    });
  </script>
</body>
</html>
