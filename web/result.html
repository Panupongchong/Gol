<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>GOL — Result</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/scaler.js" defer></script>
</head>
<body>

  <!-- ── Own result (shown after playing) ── -->
  <!-- Board art (Result_Board.png) bakes in the RESULT ribbon, confetti and the
       SCORE / COMBO / LEVEL / BEST SCORE labels; only the values, the New Record
       badge and the action buttons are overlaid. -->
  <div id="result-screen" class="screen">
    <div class="result-card">
      <span class="r-val r-score" id="r-score">0</span>
      <span class="r-val r-combo" id="r-combo">0</span>
      <span class="r-val r-level" id="r-level">1</span>
      <span class="r-val r-best"  id="r-best">0</span>

      <img class="r-badge" id="r-badge" src="img/Result/New_Record.png"
           alt="" draggable="false" style="display:none">

      <button class="r-btn r-btn--share" id="btn-share" type="button">
        <img src="img/Result/Btn_Share.png" alt="" draggable="false">
        <span class="sr-only" data-i18n="result.share">SHARE</span>
      </button>
      <button class="r-btn r-btn--retry" id="btn-retry" type="button">
        <img src="img/Result/Btn_Retry.png" alt="" draggable="false">
        <span class="sr-only" data-i18n="result.retry">RETRY</span>
      </button>
      <button class="r-btn r-btn--home" id="btn-back" type="button">
        <img src="img/Result/Btn_Home.png" alt="" draggable="false">
        <span class="sr-only" data-i18n="result.home">HOME</span>
      </button>
    </div>

    <!-- Rank-mode leaderboard (shown only after a Rank run) -->
    <div id="rank-board" style="display:none">
      <div class="rank-title" data-i18n="rank.title">RANK LEADERBOARD</div>
      <div id="rank-name-row">
        <input id="rank-name" maxlength="12" data-i18n-ph="rank.name.ph" placeholder="YOUR NAME" autocomplete="off" spellcheck="false">
        <button class="menu-btn btn-primary" id="rank-submit" data-i18n="rank.submit">SUBMIT</button>
      </div>
      <div id="rank-status"></div>
      <ol id="rank-list"></ol>
    </div>
  </div>

  <!-- ── Challenge view (opened via share link) ── -->
  <div id="challenge-screen" class="screen" style="display:none">
    <div id="challenge-title" data-i18n="challenge.title">CHALLENGE</div>
    <div class="challenge-label" data-i18n="challenge.label">CAN YOU BEAT</div>
    <div class="challenge-score" id="c-score">0</div>
    <div class="challenge-sub"   id="c-sub"></div>
    <button class="menu-btn btn-primary" id="btn-play-now" data-i18n="challenge.playnow">PLAY NOW</button>
  </div>

  <!-- ── Share modal ── -->
  <div id="share-modal" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <div class="modal-title" data-i18n="share.title">SHARE</div>
      <p class="modal-preview" id="share-preview"></p>
      <div class="share-grid">
        <button class="share-btn" id="btn-messenger">
          <span class="share-icon">💬</span>
          <span data-i18n="share.messenger">Messenger</span>
        </button>
        <button class="share-btn" id="btn-share-other">
          <span class="share-icon">&#x2191;</span>
          <span data-i18n="share.share">Share</span>
        </button>
        <button class="share-btn" id="btn-copy">
          <span class="share-icon">&#x1F517;</span>
          <span id="copy-label" data-i18n="share.copy">Copy</span>
        </button>
      </div>
      <button class="menu-btn btn-secondary" id="btn-modal-cancel" data-i18n="share.cancel">CANCEL</button>
    </div>
  </div>

  <script type="module">
    import { encryptPayload, decryptPayload } from './js/duelCrypto.js';
    import { submitScore, fetchTop } from './js/leaderboard.js';
    import { applyTranslations, t } from './js/i18n.js';
    import { openPopup, closePopup } from './js/popup.js';

    applyTranslations();

    // Set to your Facebook Instant Game App ID when ready.
    // Messenger share will use https://fb.gg/play/<ID>?d=... once configured.
    const INSTANT_GAME_ID = '';

    const params     = new URLSearchParams(window.location.search);
    const sharedData = params.get('d');

    if (sharedData) {
      showChallengeView(sharedData);
    } else {
      showOwnResult();
    }

    // ── Own result view ──────────────────────────────────────────────
    function showOwnResult() {
      const result  = JSON.parse(sessionStorage.getItem('gameResult') || '{}');
      const best    = parseInt(localStorage.getItem('bestScore') || '0', 10);
      const score   = result.score ?? 0;
      const combo   = result.combo ?? 0;
      const level   = result.level ?? 1;
      const isRank  = result.isRank === true;
      const newBest = Math.max(best, score);
      localStorage.setItem('bestScore', newBest);

      document.getElementById('r-score').textContent = score;
      document.getElementById('r-combo').textContent = combo;
      document.getElementById('r-level').textContent = level;
      document.getElementById('r-best').textContent  = newBest;

      // New Record badge — only when this run beat the previous best.
      if (score > best) document.getElementById('r-badge').style.display = '';

      // RETRY — replay the same mode; HOME — back to the menu.
      document.getElementById('btn-retry').addEventListener('click', () => {
        sessionStorage.setItem('mode', isRank ? 'rank' : 'normal');
        sessionStorage.removeItem('gameResult');
        window.location.href = 'game.html';
      });
      document.getElementById('btn-back').addEventListener('click', () => {
        sessionStorage.removeItem('gameResult');
        window.location.href = 'index.html';
      });

      // Share button: open modal.
      // Rank mode → share the score plus a plain link to play the game.
      // Otherwise → embed an encrypted challenge (seed) so others replay it.
      document.getElementById('btn-share').addEventListener('click', async () => {
        const dir = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');

        let webUrl, igUrl;
        if (isRank) {
          // Plain link to the game's landing page — no seed, fresh game for them.
          webUrl = `${dir}index.html`;
          igUrl  = INSTANT_GAME_ID
            ? `https://fb.gg/play/${INSTANT_GAME_ID}`
            : webUrl;
        } else {
          const payload = { score, combo, bonus, t: Math.floor(Date.now() / 1000), seed: result.seed };
          const encoded = await encryptPayload(payload);
          webUrl = `${dir}result.html?d=${encoded}`;
          igUrl  = INSTANT_GAME_ID
            ? `https://fb.gg/play/${INSTANT_GAME_ID}?d=${encoded}`
            : webUrl;
        }

        document.getElementById('share-preview').textContent =
          t('share.preview', { score });
        document.getElementById('btn-messenger').dataset.url   = igUrl;
        document.getElementById('btn-share-other').dataset.url = webUrl;
        document.getElementById('btn-copy').dataset.url        = webUrl;

        openPopup(document.getElementById('share-modal'));
      });

      setupShareModal();

      if (isRank) setupRankBoard(score);
    }

    // ── Rank leaderboard (Rank mode only) ────────────────────────────
    async function setupRankBoard(score) {
      document.getElementById('rank-board').style.display = '';

      const nameInput = document.getElementById('rank-name');
      const submitBtn = document.getElementById('rank-submit');
      const statusEl  = document.getElementById('rank-status');
      const listEl    = document.getElementById('rank-list');
      const nameRow   = document.getElementById('rank-name-row');

      nameInput.value = (localStorage.getItem('playerName') || '').toUpperCase();

      let myId = null;
      async function render() {
        listEl.innerHTML = `<li class="rank-msg">${t('rank.loading')}</li>`;
        try {
          renderList(listEl, await fetchTop(20), myId);
        } catch {
          listEl.innerHTML = `<li class="rank-msg">${t('rank.unavailable')}</li>`;
        }
      }

      await render();

      const sid = sessionStorage.getItem('rankSid');
      if (!sid) {
        // No valid session (offline at game start, or rules not yet published).
        nameRow.style.display = 'none';
        statusEl.textContent = t('rank.ineligible');
        return;
      }

      submitBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        if (!name) { nameInput.focus(); return; }
        localStorage.setItem('playerName', name);
        submitBtn.disabled = true;
        statusEl.textContent = t('rank.submitting');
        try {
          const entry = await submitScore(name, score, sid);
          myId = entry.id;
          sessionStorage.removeItem('rankSid'); // one submission per run
          statusEl.textContent = t('rank.submitted', { score: entry.score });
          nameRow.style.display = 'none';
          await render();
        } catch {
          statusEl.textContent = t('rank.submitfail');
          submitBtn.disabled = false;
        }
      });
    }

    function renderList(listEl, entries, myId) {
      listEl.innerHTML = '';
      if (!entries.length) {
        listEl.innerHTML = `<li class="rank-msg">${t('rank.empty')}</li>`;
        return;
      }
      entries.forEach((e, i) => {
        const li  = document.createElement('li');
        li.className = 'rank-row' + (e.id === myId ? ' me' : '');
        const pos = document.createElement('span'); pos.className = 'rank-pos';   pos.textContent = i + 1;
        const nm  = document.createElement('span'); nm.className  = 'rank-name-cell'; nm.textContent = e.name || 'ANON';
        const sc  = document.createElement('span'); sc.className  = 'rank-score'; sc.textContent = e.score;
        li.append(pos, nm, sc);
        listEl.appendChild(li);
      });
    }

    // ── Challenge view (opened from share link) ──────────────────────
    async function showChallengeView(encoded) {
      document.getElementById('result-screen').style.display    = 'none';
      document.getElementById('challenge-screen').style.display = '';

      let challengeSeed = null;
      try {
        const payload = await decryptPayload(encoded);
        document.getElementById('c-score').textContent = payload.score ?? '?';
        if (payload.combo) {
          document.getElementById('c-sub').textContent = t('challenge.combo', { combo: payload.combo });
        }
        if (payload.seed != null) challengeSeed = payload.seed;
      } catch {
        document.getElementById('c-score').textContent = '?';
      }

      document.getElementById('btn-play-now').addEventListener('click', () => {
        sessionStorage.removeItem('gameResult');
        if (challengeSeed != null) sessionStorage.setItem('pendingSeed', challengeSeed);
        window.location.href = 'game.html';
      });
    }

    // ── Share modal ──────────────────────────────────────────────────
    function setupShareModal() {
      const modal = document.getElementById('share-modal');

      document.getElementById('btn-modal-cancel').addEventListener('click', closePopup);
      modal.addEventListener('click', e => {
        if (e.target === modal) closePopup();
      });

      // Messenger → fb-messenger:// deep link (Instant Game URL if configured)
      document.getElementById('btn-messenger').addEventListener('click', () => {
        const url = document.getElementById('btn-messenger').dataset.url;
        window.location.href = `fb-messenger://share?link=${encodeURIComponent(url)}`;
      });

      // Share → Web Share API; fallback to WhatsApp
      document.getElementById('btn-share-other').addEventListener('click', async () => {
        const url  = document.getElementById('btn-share-other').dataset.url;
        const text = document.getElementById('share-preview').textContent;
        if (navigator.share) {
          try { await navigator.share({ url, text }); } catch {}
        } else {
          window.open(`https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`);
        }
      });

      // Copy link
      document.getElementById('btn-copy').addEventListener('click', async () => {
        const url   = document.getElementById('btn-copy').dataset.url;
        const label = document.getElementById('copy-label');
        try {
          await navigator.clipboard.writeText(url);
          label.textContent = t('share.copied');
          setTimeout(() => { label.textContent = t('share.copy'); }, 2000);
        } catch {
          prompt('Copy this link:', url);
        }
      });
    }
  </script>
</body>
</html>
