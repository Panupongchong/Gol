<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>GOL</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/scaler.js" defer></script>
</head>
<body>
  <div id="menu-screen" class="screen">

    <div id="menu-title">
      NUMBER PARTY
      <span id="menu-subtitle">HighLow Rush</span>
    </div>

    <button class="menu-btn btn-primary"   id="btn-play">NORMAL</button>
    <button class="menu-btn btn-secondary" id="btn-rank">RANK</button>

    <button id="sound-toggle" class="icon-btn" type="button" aria-label="Toggle sound">🔊</button>

  </div>

  <script type="module">
    import { isMuted, toggleMute } from './js/sfx.js';

    document.getElementById('btn-play').addEventListener('click', () => {
      sessionStorage.setItem('mode', 'normal');
      window.location.href = 'game.html';
    });
    document.getElementById('btn-rank').addEventListener('click', () => {
      sessionStorage.setItem('mode', 'rank');
      window.location.href = 'game.html';
    });

    // Sound on/off — persisted in localStorage by sfx.js, shared with the game.
    const soundBtn = document.getElementById('sound-toggle');
    const renderSound = () => {
      const muted = isMuted();
      soundBtn.textContent = muted ? '🔇' : '🔊';
      soundBtn.classList.toggle('muted', muted);
    };
    renderSound();
    soundBtn.addEventListener('click', () => { toggleMute(); renderSound(); });
  </script>
</body>
</html>
